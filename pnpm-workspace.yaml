packages:
  - '.'
# Moved here from .npmrc, which is INI: the YAML block there parsed as junk
# and pinned nothing.
overrides:
  vite: 6.3.5
supportedArchitectures:
  os:
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
# Refuse packages published < 7 days ago (10080 minutes).
minimumReleaseAge: 10080
allowBuilds:
  '@biomejs/biome': true
  '@tailwindcss/oxide': true
  esbuild: true
